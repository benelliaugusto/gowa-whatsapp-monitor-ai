<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">mi</span>
        <span class="brand-name">{{ app_name }}</span>
      </a>
      <nav class="nav">
        <a href="/" class="{{ 'is-active' if page == 'painel' else '' }}">Painel</a>
        <a href="/relatorios" class="{{ 'is-active' if page == 'relatorios' else '' }}">Relatórios</a>
        <a href="/acoes" class="{{ 'is-active' if page == 'acoes' else '' }}">Ações</a>
        <a href="/status" class="{{ 'is-active' if page == 'status' else '' }}">Status</a>
        <a href="/docs" target="_blank" rel="noopener">API &#8599;</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    {{ app_name }} v{{ version }} &middot; fuso {{ fuso }} &middot; {{ hoje }}
  </footer>
</body>
</html>
